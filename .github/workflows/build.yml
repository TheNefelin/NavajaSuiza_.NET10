name: Build & Test

on:
  push:
    branches: [master]
    # El workflow sync-manual publica el README con un commit del bot. Si este
    # job lo tomara, cada sincronizacion dispararia un run completo de tests
    # que no valida ningun cambio de codigo.
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'README.md'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test (Core + Test)
        run: dotnet test NavajaSuiza.Test/NavajaSuiza.Test.csproj --configuration Release --verbosity normal
